name: snapshot finished games

on:
  schedule:
    - cron: "0 * * * *"     # top of every hour (UTC)
  workflow_dispatch: {}      # adds a manual "Run workflow" button for testing

permissions:
  contents: write            # lets the job commit the JSON back to the repo

concurrency: snapshot        # never let two runs overlap

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snapshot new finished games
        run: node snapshot.mjs
      - name: Commit any new snapshots
        run: |
          git config user.name  "tiktactownship-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games index.json
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "snapshot finished games ($(date -u +%FT%TZ))"
            git push
          fi
